# WirePlumber (0.5, Debian Trixie): the output of the jukebox starts at full volume.
# WirePlumber's default for a sink that has no saved state is 0.064 (cubic), which wpctl shows as 0.40: on a new box
# everything was too quiet (seen on feuerwehrv1). The volume itself is set by the jukebox ([audio] start_volume) and
# by Soloist. Installed by the image to /etc/wireplumber/wireplumber.conf.d/.
wireplumber.settings = {
  device.routes.default-sink-volume = 1.0
}
