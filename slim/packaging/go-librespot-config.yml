# Nach ~/.config/go-librespot/config.yml kopieren.
# Schlüssel und Standardwerte laut go-librespot-README; vollständiges Schema
# steht dort in config_schema.json.

device_name: Jukebox          # so erscheint die Box in der Spotify-App
audio_backend: alsa
audio_device: default         # mit dem MiniAmp-Overlay und abgeschaltetem Onboard-Audio ist das die DAC-Karte (mit `aplay -l` prüfen)

credentials:
  type: device_auth           # Code-Login: Link/Code erscheint im Log, Eingabe auf spotify.com/pair

server:                       # lokale REST-API, nur von diesem Gerät erreichbar
  enabled: true
  address: localhost
  port: 3678
