# Fire engine box, first draft ("Feuerwehr v1"). Pinout from the project documentation (physical pins -> BCM),
# see README.md. This was the very first prototype: shakier wiring (perfboard) and a part list that differs from the
# other boxes (no display, volume by rotary encoder only). Everything marked "unverified" has not been tried
# on the hardware yet.

[box]
name = "feuerwehrv1"

[audio]
start_volume = 35        # with the PipeWire sink of user jukebox at 1.0 (it was 0.40 and made everything quiet)
max_volume = 80          # hard cap, also applies to the knob
volume_step = 5

[cards]
same_card = "restart"    # toggle | ignore | restart | next
same_card_delay = 3.0

[spotify]
enabled = true
backend = "soloist"                  # assumption: one of the children's Family accounts (no audio key from go-librespot)
soloist_ws = "127.0.0.1:9090"
api_url = "http://127.0.0.1:3678"   # only used with backend = "go-librespot"

[local]
enabled = true
root = "~/music"

# --- readers ---------------------------------------------------------------
# The documentation only lists a flat card reader (9.5 x 6.2 x 1.1 cm), no RDM6300 and no UART pins, so it is a
# USB one.
[readers.usb]
enabled = true
device_name = "RFID"          # unverified: substring of the evdev device name of the reader

[readers.rdm6300]
enabled = false

# --- GPIO (BCM numbers) ------------------------------------------------------
# Buttons are wired to GND (internal pull-up, as in the old script). Reserved elsewhere: 18/19/21 I2S (MiniAmp), 2/3 I2C (off here, GPIO 3 is
# the power button).
[gpio]
chip = "/dev/gpiochip0"

[[gpio.button]]            # blue left (pin 38, GND pin 9): previous. GPIO 20 works because [boot] i2s_free_gpio20 = true
pin = 20
action = "prev"

[[gpio.button]]            # blue right (pin 37, GND pin 30): next
pin = 26
action = "next"

[[gpio.button]]            # yellow left (pin 33, GND pin 25): the documentation says "stop", the old script (gpio.py)
pin = 13                   # paused (playerpause), so it pauses / resumes
action = "play_pause"

[[gpio.button]]            # yellow right (pin 5, GND pin 25): shutdown only when held 2 s. GPIO 3 also wakes the Pi from halt.
pin = 3
hold_action = "shutdown"
hold_time = 2.0

[[gpio.button]]            # red (pin 13, GND pin 14): "Tatuetata". Action defined in hooks.py (not written yet)
pin = 27
action = "sirene"

[[gpio.button]]            # encoder push button (SW, pin 15): short press = siren (as long as the red button is not wired),
pin = 22                   # held 2 s = mute / unmute the siren (old script: mute_alarm). The press fires on release.
action = "sirene"
hold_action = "alarm_mute"
hold_time = 2.0

[[gpio.rotary]]            # encoder: CLK pin 31 (GPIO 6), DT pin 29 (GPIO 5), + pin 17 (3V3), GND pin 34
pin_a = 6                  # The old script used A = GPIO 5, B = GPIO 6 and "turn right = louder". Its decoder
pin_b = 5                  # counts clockwise when A leads, this one when pin_b leads, so the order is swapped here
cw = "volume_up"           # to keep the direction. Not tried with this code: swap cw/ccw if it turns the wrong way.
ccw = "volume_down"

# LEDs: the yellow front lights are always on (`on = true`); the blue lights are dark and only run in the siren show
# (hooks.py).
[[gpio.led]]               # pin 18, blue left (100 Ohm), "Blaulicht"
name = "blue_left"
pin = 24

[[gpio.led]]               # pin 16, blue right (100 Ohm), "Blaulicht"
name = "blue_right"
pin = 23

[[gpio.led]]               # pin 22, both yellow LEDs in parallel (220 Ohm each), "Fernlicht": always on
name = "yellow"            # (the siren flashes them and hooks.py switches them back on afterwards, see [siren])
pin = 25
on = true

# --- potentiometer ------------------------------------------------------------
# The documentation lists "1 Potentiometer" and "Ansteuerung Potentiometer" as a to-do, but volume is on the rotary
# encoder in the pin list. So no ADS1115.
[adc]
enabled = false

# --- sounds and hooks ---------------------------------------------------------
[sounds.events]
# Sounds by convention: ~/.config/jukebox/startup.mp3 (boot) and shutdown.mp3. Private files, not in this repository.

[display]                    # this box has no display
enabled = false

[covers]
spotify_search = true
write_to_folder = true

[sync]
enabled = true            # needs rclone with the remote `dropbox` (see docs/SYNC.md)
remote = "dropbox:Jukebox2.0"
interval_minutes = 30
cards = "both"
config = "pull"           # Jukebox2.0/boxes/feuerwehrv1/ -> ~/.config/jukebox/ (startup.mp3, ...)
music = "pull"

[web]
enabled = true            # no password: trusted home network only
port = 8080

[hooks]
file = "hooks.py"          # siren (red button) with light show, and the siren mute (encoder button held)

[siren]                    # read by hooks.py
sound = "~/.config/jukebox/martinshorn.mp3"   # private file, not in the repository (sync: boxes/feuerwehrv1/)
rounds = 7                 # light rounds of 4 x 0.25 s, as in the old script
step = 0.25
front_lights = true        # the yellow lights stay on when the siren is not running; false = dark when idle

# --- device tree overlays, applied by: jukebox setup --apply -------------------
[boot]
audio = "hifiberry-miniamp"   # dtoverlay=hifiberry-dac, on-board audio off
i2s_free_gpio20 = true        # own overlay: the DAC does not need I2S data-in, so GPIO 20 is a normal pin (needs dtc)
spi = false                   # no display
i2c = false

[system]
# needs /etc/sudoers.d/jukebox, see docs/INSTALL.md
shutdown_command = ["sudo", "systemctl", "poweroff"]
